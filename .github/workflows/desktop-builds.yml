# Builds Prime Word for Windows, macOS and Linux on GitHub's own machines.
#
# Runs when started by hand (Actions → Desktop builds → Run workflow) or when a version tag (v0.2.0…)
# is pushed. The installers are attached to the run as downloadable artifacts; nothing is published.
# Only GitHub's own actions are used. None of the builds is code-signed yet: Windows SmartScreen and
# macOS Gatekeeper will warn (on a Mac: right-click the app → Open, the first time).
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            args: ""
            artifact: apps/word/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS (Apple silicon and Intel)
            os: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
            artifact: apps/word/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux
            # The oldest supported Ubuntu: the AppImage then runs on older Linux systems too.
            os: ubuntu-22.04
            bundles: deb,appimage
            args: ""
            artifact: |
              apps/word/src-tauri/target/release/bundle/deb/*.deb
              apps/word/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Rust (current stable)
        run: rustup update stable && rustup default stable

      - name: Rust targets for a universal macOS app
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux system libraries (WebKitGTK and friends)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: npm ci

      - name: Engine packages
        run: npm run build

      - name: Build the app and its installer
        working-directory: apps/word
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: prime-word-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
