[package]
name = "prime-word"
version = "0.1.0"
description = "Prime Word — a professional word processor by Prime Productivity"
authors = ["Prime Productivity"]
license = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "prime_word_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# Already part of the app (through Tauri); these features add Windows' own offline text recognition
# setting a folder hidden (a project's .primeword folder) and Windows' share panel (Share).
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Win32_Storage_FileSystem", "Win32_System_WinRT", "Win32_UI_Shell"] }
# Already part of the app too (through the windows crate): the list of files handed to the share panel.
windows-collections = "0.3"

[profile.release]
# Thin LTO: most of the size benefit of full LTO at a fraction of the build time and CPU load.
lto = "thin"
strip = true
