[package]
name = "prime-word"
version = "0.1.0"
description = "Prime Word — a professional word processor by Prime Productivity"
authors = ["Prime Productivity"]
license = ""
edition = "2021"
rust-version = "1.90"

[lib]
name = "prime_word_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"

[profile.release]
# Thin LTO: most of the size benefit of full LTO at a fraction of the build time and CPU load.
lto = "thin"
strip = true
